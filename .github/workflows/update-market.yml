name: Refresh OSRS market data
on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/update-market.mjs'
      - '.github/workflows/update-market.yml'
permissions:
  contents: write
concurrency:
  group: market-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/update-market.mjs
      - name: Commit refreshed market snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.json
          if ! git diff --cached --quiet; then
            git commit -m "Update OSRS market snapshot"
            git push
          fi
